<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Todo</title>
</head>
<body>
  <h1>Project Todo</h1>
  <p id="health">서버 상태 확인 중…</p>
  <script>
    fetch("/api/health")
      .then((r) => r.json())
      .then((d) => { document.getElementById("health").textContent = `서버 정상 (저장소: ${d.db_backend})`; })
      .catch(() => { document.getElementById("health").textContent = "서버에 연결할 수 없습니다."; });
  </script>
</body>
</html>
